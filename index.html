<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Facebook</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
       
</head>
<body>

    <header class="fb-header">

        <!--left-->

        <div class="header-left">
            <div class="fb-logo">
                <img src="images/logo.webp" alt="facebook-logo"></div>

            <div class="seacrh-box">
                <img src="images/icons8-search-30.png" alt="search">
                <input
                 type="text" placeholder="Search Facebook">
            </div>
        </div>

        <!--center-->

        <div class="header-center">
            <div class="nav-icon">
                <img src="images/icons8-home-24.png" alt="home-button">
            </div>
            <div class="nav-icon">
                <img src="images/icons8-account-male-30.png" alt="friends">
            </div>

            <div class="nav-icon">
                <img src="images/icons8-instagram-reels-32.png" alt="reel">
            </div>

            <div class="nav-icon">
                <img src="images/icons8-shop-30 (1).png" alt="marketplace">
            </div>

            <div class="nav-icon">
                <img src="images/icons8-group-30.png" alt="group">
            </div>
        </div>

        <!--right-->
        <div class="header-right">
            <div class="circle">
                <img src="images/icons8-menu-50.png" alt="menu">
            </div>
            <div class="circle">
                <img src="images/icons8-messenger-50.png" alt="messenger">
            </div>

            <div class="circle">
                <img src="images/icons8-notification-bell-50.png" alt="notification">
            </div>

            <div class="profile">
                <img src="images/icons8-profile-50.png" alt="profile">
            </div>
        </div>

    </header>
 
                        <!--Main Area-->
                        
        <main class="main">

            <aside>
                <div class="sidebar-items">
                    <img src="images/icons8-profile-50.png" alt="profile-pic">
                    <span>Facebook User</span>
                </div>
                    <div class="sidebar-items">
                        <img src="images/meta-ai-removebg-preview.png" alt="meta-ai">
                        <span>Meta AI</span></div>
        <div class="sidebar-items">
            <img src="images/icons8-account-male-30.png" alt="friends">
            <span>Friends</span></div>
        <div class="sidebar-items">
            <img src="images/icons8-memories-24.png" alt="memories">
            <span>Memories</span></div>
        <div class="sidebar-items">
            <img src="images/icons8-bookmark-64.png" alt="saved">
            <span>Saved</span></div>
        <div class="sidebar-items">
            <img src="images/icons8-group-30.png" alt="group">
            <span>Groups</span></div>
        <div class="sidebar-items">
            <img src="images/icons8-shop-30 (1).png" alt="marketplace">
            <span>Marketplace</span></div>
        <div class="sidebar-items">
            <img src="images/icons8-instagram-reels-32.png" alt="reels">
            <span>Reels</span></div>
        <div class="sidebar-items">
            <img src="images/icons8-about-30.png" alt="reels">
            <span>Feeds</span></div>
        <div class="sidebar-items">
            <img src="images/icons8-events-48.png" alt="events">
            <span>Events</span></div>
        <div class="sidebar-items">
            <img src="images/icons8-signal-64.png" alt="ads-manager">
            <span>Ads Manager</span></div>
            </aside>


            <!--Feed-->

            <section class="feed">

        <div class="post-box">
            <img src="images/icons8-profile-50.png" alt="profile-pic">
            <input style="background-color: rgb(231, 237, 237);" type="text" placeholder="What's on your mind?,Facebook User">
        </div>

        <div class="post">
             <img style="width: 30px;" src="images/icons8-instagram-48.png" alt="user-pic">
           Instgram 
            <p>whats your winter arc giving this year?</p>

            <div class="interaction">
            <img style="width: 29px;" src="images/icons8-like-24.png" alt="like">
            <span>Like</span>
            <img style="width: 29px; display: flex; align-items: center;" src="images/icons8-comment-32.png" alt="comment">
            <span>Commnet</span>
            <img style="width: 29px;" src="images/icons8-share-24.png" alt="share">
            <span>Share</span>
            </div>
        </div>

        <div class="post">
            <img style="width: 30px;" src="images/icons8-image-48.png" alt="user-pic">
            Royal Desi Food
            <p>Tea time</p>
            <p><strong>...See more</strong><p>
            <img src="images/Tea-Time-Vision-Mision1.jpg" alt="user-shared-photo">
            <br>
            <div class="interaction">
                <span>
            <img style="width: 29px;" src="images/icons8-like-24.png" alt="like">
                </span>
            <span>Like</span>
            <img style="width: 29px;" src="images/icons8-comment-32.png" alt="comment">
            <span>Commennt</span>
            <img src="images/icons8-share-24.png" alt="share" style="width: 29px;">
            <span>Share</span>
            </div>
        </div>

            </section>

            <aside class="right-sidebar">
                <h2>Contacts</h2>
                <div class="contact">
                    <img src="images/meta-ai-removebg-preview.png" alt="meta-ai">
                    Meta AI</div>
                <div class="contact">
                    <img src="images/user 1.jpg" alt="user-1">
                    Jhon Abraham</div>
                <div class="contact">
                    <img src="images/user2.jpg" alt="user-2">
                    Angel Maria</div>
                <div class="contact">
                    <img src="images/user3.jpg" alt="user-3">
                    Jio Joseph</div>
                    <hr width="350px">
            </aside>
        </main>            


   <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

    
</body>
</html>
